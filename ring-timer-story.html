  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="style.css">
  <style>
    /* Article-specific media & layout enhancements sharing style.css tokens */
    .story-media {
      grid-column: 4 / 10;
      margin: 24px 0 32px;
    }
    .story-media img {
      width: 100%;
      height: auto;
      max-width: 680px;
      display: block;
      border-radius: 4px;
    }
    .story-media figcaption {
      margin-top: 8px;
      font-size: var(--type-small);
      color: var(--muted);
    }
    blockquote.feedback-quotes {
      grid-column: 4 / 10;
      margin: 20px 0 32px;
      padding-left: 20px;
      border-left: 2px solid var(--ink);
      font-style: italic;
      color: var(--ink);
    }
    blockquote.feedback-quotes ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    blockquote.feedback-quotes li {
      margin-bottom: 10px;
    }
    blockquote.feedback-quotes li:last-child {
      margin-bottom: 0;
    }
    .back-nav {
      margin-top: 32px;
      display: inline-block;
    }
    @media (max-width: 760px) {
      .story-media, blockquote.feedback-quotes {
        grid-column: 1 / 7;
      }
    }
  </style>
</head>
